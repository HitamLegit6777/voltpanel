# ============ VoltPanel Configuration ============
# Copy to config.toml and adjust. Paths below are relative to the data_dir.

[general]
instance_name = "VoltPanel"
# locale: en / id
locale = "en"
# Base data directory (absolute or relative to cwd)
data_dir = "./data"
log_level = "info"
# Days of audit history to keep. Pruned probabilistically (~1/1000 writes);
# the newest ~500 entries are always retained.
audit_retention_days = 90

[web]
# Bind address. For public access use 0.0.0.0:8080 behind a reverse proxy.
listen = "127.0.0.1:8080"
session_ttl_hours = 24
max_body_mb = 64
# Serve HTTPS with a self-signed certificate stored in <data_dir>/tls.
# Use this when the panel has no domain name: nodes pin the certificate
# fingerprint printed at startup instead of validating a public chain.
tls_self_signed = false
# Extra hostnames/IPs to include in that certificate (the local hostname and
# loopback addresses are always included).
tls_extra_sans = []
# Reverse proxies allowed to set X-Forwarded-For / X-Forwarded-Proto
# (CIDR list, e.g. ["127.0.0.1", "10.0.0.0/8"]). Empty means the socket
# peer address is always authoritative and forwarded headers are ignored.
trusted_proxies = []
# Extra browser origins (scheme://host[:port]) allowed for cookie-authenticated
# mutations. Empty keeps the default same-host rule only. Use https:// entries
# when TLS is enabled.
allowed_origins = []

[paths]
servers_dir = "servers"
backups_dir = "backups"
blueprints_dir = "blueprints"
logs_dir = "logs"
website_dir = "websites"
# Data Lab SQLite storage. Kept outside servers_dir on purpose: a server root
# is bind-mounted into the workload sandbox and owned by the workload UID, so
# databases stored under it are workload-writable.
datalab_dir = "datalab"

[limits]
default_memory_mb = 1024
default_disk_mb = 8192
default_cpu_percent = 100
max_memory_mb = 16384
max_servers_per_user = 16

[security]
argon2_cost = 3
argon2_mem_kib = 65536
rate_limit_per_min = 120
password_min_len = 8
allow_cross_server_dir = false

[features]
enable_backups = true
enable_databases = true
enable_schedules = true
enable_api_keys = true
enable_2fa = true
enable_websites = true
enable_audit_log = true

# Embedded host-routing gateway. Maps the Host header of each request to a
# website record on its own listener — put it in front of the public vhost
# traffic, away from the admin panel (web.listen).
[sites]
# Listen address, e.g. "0.0.0.0:8081". Unset (default) disables the gateway.
# A bind failure on a configured address aborts startup (fail fast).
# listen = "0.0.0.0:8081"
# Reverse proxies allowed to set X-Forwarded-Proto on gateway requests
# (CIDR list). The gateway terminates plain HTTP, so force_https sites are
# only served when a trusted proxy reports "X-Forwarded-Proto: https".
# Empty (default) means the header is never trusted.
trusted_proxies = []
# Max request body (MiB) the gateway buffers when reverse-proxying to a
# site's upstream. Independent of web.max_body_mb (the panel's own cap):
# public vhost traffic gets its own ceiling so a large panel upload cap
# never widens the proxied surface. Default 16, range 1..=64.
max_body_mb = 16