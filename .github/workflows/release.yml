name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: linux-amd64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure ARM toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: Build binaries
        run: cargo build --locked --release --bins --target "${{ matrix.target }}"
      - name: Stage assets
        run: |
          install -m755 "target/${{ matrix.target }}/release/voltpanel" "voltpanel-${{ matrix.asset }}"
          install -m755 "target/${{ matrix.target }}/release/voltd" "voltd-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.asset }}
          path: |
            voltpanel-${{ matrix.asset }}
            voltd-${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum voltpanel-linux-* voltd-linux-* > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            voltpanel-linux-amd64
            voltpanel-linux-arm64
            voltd-linux-amd64
            voltd-linux-arm64
            SHA256SUMS
