name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here. Use a private Security Advisory."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Panel backend, Node daemon, Isolation, Multi-node, UI, Installer, Documentation, Blueprint]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, passwords, node secrets and private data.
      render: shell
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 x86_64
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data.
          required: true
