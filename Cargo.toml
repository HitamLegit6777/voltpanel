[package]
name = "voltpanel"
version = "0.1.1"
edition = "2021"
description = "Linux-native workload control plane with VoltSpec blueprints and execution agents"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "hooks"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
argon2 = "0.5"
aes-gcm = "0.10"
qrcode = "0.13"
image = { version = "0.24", default-features = false, features = ["png"] }
rand = "0.8"
futures = "0.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
glob = "0.3"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
walkdir = "2"
libc = "0.2"
sysinfo = "0.30"
toml = "0.8"
cron = "0.12"
url = "2"
mime_guess = "2"
percent-encoding = "2"
async-trait = "0.1"
parking_lot = "0.12"
async-stream = "0.3"
dashmap = "6"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hostname = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
tower-service = "0.3"
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio", "client-legacy", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12", "webpki-roots"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
