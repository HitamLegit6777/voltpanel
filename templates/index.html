<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1B5E20">
<title>VoltPanel</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css?v=__ASSET_VERSION__">
<script>
/* Apply the saved/system theme before first paint so the boot screen does not
   flash the wrong mode. Mirrors the logic in static/js/app.js. */
(function () {
  try {
    var t = localStorage.getItem("volt-theme");
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app">
  <div class="boot-screen">
    <div class="boot-logo">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01M10 6.5h.01M10 17.5h.01"/></svg>
      <span>VoltPanel</span>
    </div>
    <div class="boot-spinner"></div>
  </div>
</div>
<noscript>
  <div class="no-js-card">
    <strong>VoltPanel requires JavaScript</strong>
    <p class="no-js-note">This panel is a single-page application and cannot run without JavaScript. Please enable it and reload.</p>
  </div>
</noscript>
<script src="/static/js/icons.js?v=__ASSET_VERSION__"></script>
<script src="/static/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
